name: Test

on:
  push:
  pull_request:

jobs:
  golangci-lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/checkout@v4

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --verbose

  golangci-test:
    strategy:
      fail-fast: false
      matrix:
        platform:
        - ubuntu-latest
        - macOS-latest
        go:
        - '1.24'
        - '1.25'
    name: '${{ matrix.platform }} | ${{ matrix.go }}'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/checkout@v4
      - run: go test ./...
