name: Test

on:
  push:
  pull_request:

jobs:
  golangci-lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --verbose

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  golangci-test:
    strategy:
      fail-fast: false
      matrix:
        platform:
        - ubuntu-latest
        - macOS-latest
        go:
        - '1.25'
        - '1.26'
    name: '${{ matrix.platform }} | ${{ matrix.go }}'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      # the video integration tests need ffmpeg. It is quick to install on
      # ubuntu, where a missing ffmpeg fails the run. macOS skips just those
      # tests rather than spend minutes in brew; the parsing tests still run
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - if: runner.os == 'macOS'
        run: echo "MIMAGE_SKIP_FFMPEG=1" >> "$GITHUB_ENV"
      - run: go test ./...
